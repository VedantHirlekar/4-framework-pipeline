events {

    worker_connections 1024;

}

http {

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    error_log /var/log/nginx/error.log warn;


    upstream backend {

        server fastapi:8000;

        server express:3000;

        server springboot:8080;

        server dotnet:5000;

        keepalive 32;
    }


    server {

        listen 80;

        server_name _;


        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "SAMEORIGIN" always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;


        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        proxy_connect_timeout 5s;

        proxy_send_timeout 60s;

        proxy_read_timeout 60s;


        proxy_buffering on;

        proxy_buffers 16 16k;

        proxy_buffer_size 16k;


        location /api/v1/ {

            proxy_pass http://backend/;

        }


        location = / {

            default_type text/plain;

            return 200 "Round-Robin API Gateway Running\n";

        }


        location ~ /\. {

            deny all;

        }

    }

}

# 1. First check your docker-compose.yml

# Look for the NGINX service and especially the volumes section:

# nginx:
#   image: nginx:latest
#   volumes:
#     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

# If you currently have something like that, NGINX is using:

# ./nginx/nginx.conf

# as its main configuration.

# 2. Backup your current working configuration

# From your project directory:

# cp nginx/nginx.conf nginx/nginx.conf.backup

# Now you have:

# nginx/
# ├── nginx.conf
# ├── nginx.conf.backup
# └── nginx-round-robin.conf
# 3. Replace nginx.conf with the round-robin configuration
# cp nginx/nginx-round-robin.conf nginx/nginx.conf

# Now:

# nginx/nginx.conf

# contains your new round-robin configuration.

# Your old configuration is safely stored as:

# nginx/nginx.conf.backup
# 4. Check the configuration before restarting

# This is important.

# Run:

# docker compose exec nginx nginx -t

# You should get something similar to:

# nginx: the configuration file /etc/nginx/nginx.conf syntax is ok
# nginx: configuration file /etc/nginx/nginx.conf test is successful

# If you get an error, don't restart yet. Fix the configuration first.

# 5. Restart/recreate NGINX

# Because you're changing a mounted configuration file, you can restart NGINX:

# docker compose restart nginx

# Then check:

# docker compose ps

# and:

# docker compose logs nginx
# 6. Test your new common URL

# Now try:

# curl http://localhost/api/v1/health

# If all four applications have /health, make several requests:

# curl http://localhost/api/v1/health
# curl http://localhost/api/v1/health
# curl http://localhost/api/v1/health
# curl http://localhost/api/v1/health

# However, your response needs to identify which backend handled the request if you want to visually confirm round-robin.

# Your existing log format already gives you this:

# upstream=$upstream_addr

# So check:

# docker compose exec nginx cat /var/log/nginx/access.log

# You should see entries containing different upstreams, such as:

# upstream=172.x.x.x:8000
# upstream=172.x.x.x:3000
# upstream=172.x.x.x:8080
# upstream=172.x.x.x:5000
# Your complete workflow
# nginx-round-robin.conf
#         |
#         | copy
#         ↓
# nginx.conf
#         |
#         ↓
# nginx -t
#         |
#         ↓
# docker compose restart nginx
#         |
#         ↓
# curl /api/v1/health
#         |
#         ↓
# NGINX
#         |
#         ├── FastAPI
#         ├── Express
#         ├── Spring Boot
#         └── .NET