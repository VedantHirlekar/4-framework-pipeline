events {

    worker_connections 1024;

}


http {

    # =========================================================
    # LOGGING
    # =========================================================
    # NGINX logging:
#
# By default, the official NGINX Docker image redirects:
#     /var/log/nginx/access.log -> /dev/stdout
#
# This means NGINX does not store access logs as a normal persistent file.
# The logs are sent to Docker's stdout, so we can see them using:
#     docker compose logs nginx
#
# To store logs as a real access.log file inside the container, remove the
# default /dev/stdout symlink in the NGINX Dockerfile and configure:
#     access_log /var/log/nginx/access.log main;
#
# The line above tells NGINX:
#     "Write every HTTP access/request log to the file
#      /var/log/nginx/access.log using the 'main' log format."
#
# To also persist these log files on the host, we use:
#     - ./nginx/logs:/var/log/nginx
#
# This is a Docker bind mount. It means:
#
#     Host:
#     ./nginx/logs/
#            ↕
#     Container:
#     /var/log/nginx/
#
# So when NGINX writes:
#     /var/log/nginx/access.log
#
# Docker actually stores that file in:
#     ./nginx/logs/access.log
#
# The same file can therefore be accessed from both the host and container.
#
# After adding the volume, enter the NGINX container with:
#     docker compose exec nginx sh
#
# Then:
#     cd /var/log/nginx
#     cat access.log
#
# Or continuously watch new requests with:
#     tail -f access.log
#
# This allows us to see the same NGINX access.log from inside the container
# while also keeping a copy on the host.

#we added the volume in docker compose and then we can enter the nginx container
#and check logs in cd /var/log/nginx cat access.log



    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    error_log /var/log/nginx/error.log warn;


    # =========================================================
    # UPSTREAM SERVICES
    # =========================================================

    upstream fastapi {

        server fastapi:8000;

        keepalive 32;
    }


    upstream express {

        server express:3000;

        keepalive 32;
    }


    upstream springboot {

        server springboot:8080;

        keepalive 32;
    }


    upstream dotnet {

        server dotnet:5000;

        keepalive 32;
    }


    # =========================================================
    # API GATEWAY
    # =========================================================

    server {

        listen 80;

        server_name _;


        # =====================================================
        # BASIC SECURITY
        # =====================================================

        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "SAMEORIGIN" always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;


        # =====================================================
        # COMMON PROXY SETTINGS
        # =====================================================

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        # =====================================================
        # TIMEOUTS
        # =====================================================

        proxy_connect_timeout 5s;

        proxy_send_timeout 60s;

        proxy_read_timeout 60s;


        # =====================================================
        # BUFFERING
        # =====================================================

        proxy_buffering on;

        proxy_buffers 16 16k;

        proxy_buffer_size 16k;


        # =====================================================
        # FASTAPI
        # =====================================================
#When a client sends a request whose path starts with /api/v1/implementations/fastapi/, 
#use the rules inside this block.
#For example
#/api/v1/implementations/fastapi/
#/api/v1/implementations/fastapi/health
#/api/v1/implementations/fastapi/employees
#proxy pass tells nginx Forward the matched request to the upstream named fastapi
#Because the proxypass has trailing /
#NGINX replaces the matching location prefix
#For example http://localhost/api/v1/implementations/fastapi/health
#nginx sees /api/v1/implementations/fastapi/ and replaces that part with /
#So the backend receives:
#http://fastapi:8000/health

# "fastapi" here refers to the NGINX upstream named "fastapi".
# The upstream points to the FastAPI container on port 8000.
# Therefore, http://fastapi/ does NOT mean localhost:8000.
# It means: send the request to the server defined in the "fastapi" upstream.
#proxy_pass http://fastapi/;

        location /api/v1/implementations/fastapi/ {

            proxy_pass http://fastapi/;

        }



        # =====================================================
        # EXPRESS
        # =====================================================

        location /api/v1/implementations/express/ {

            proxy_pass http://express/;

        }


        # =====================================================
        # SPRING BOOT
        # =====================================================

        location /api/v1/implementations/springboot/ {

            proxy_pass http://springboot/;

        }


        # =====================================================
        # DOTNET
        # =====================================================

        location /api/v1/implementations/dotnet/ {

            proxy_pass http://dotnet/;

        }


        # =====================================================
        # ROOT
        # =====================================================

        location = / {

            default_type text/plain;

            return 200 "API Gateway Running\n";

        }


        # =====================================================
        # BLOCK HIDDEN FILES
        # =====================================================

        location ~ /\. {

            deny all;

        }

    }

}



#curl http://localhost/api/v1/implementations/fastapi/health

#curl http://localhost/api/v1/implementations/express/health

#curl http://localhost/api/v1/implementations/springboot/health

#curl http://localhost/api/v1/implementations/dotnet/health