events {

    worker_connections 1024;

}


http {

    # =========================================================
    # LOGGING
    # =========================================================
    # NGINX logging:
#
# By default, the official NGINX Docker image redirects:
#     /var/log/nginx/access.log -> /dev/stdout
#
# This means NGINX does not store access logs as a normal persistent file.
# The logs are sent to Docker's stdout, so we can see them using:
#     docker compose logs nginx
#
# To store logs as a real access.log file inside the container, remove the
# default /dev/stdout symlink in the NGINX Dockerfile and configure:
#     access_log /var/log/nginx/access.log main;
#
# The line above tells NGINX:
#     "Write every HTTP access/request log to the file
#      /var/log/nginx/access.log using the 'main' log format."
#
# To also persist these log files on the host, we use:
#     - ./nginx/logs:/var/log/nginx
#
# This is a Docker bind mount. It means:
#
#     Host:
#     ./nginx/logs/
#            ↕
#     Container:
#     /var/log/nginx/
#
# So when NGINX writes:
#     /var/log/nginx/access.log
#
# Docker actually stores that file in:
#     ./nginx/logs/access.log
#
# The same file can therefore be accessed from both the host and container.
#
# After adding the volume, enter the NGINX container with:
#     docker compose exec nginx sh
#
# Then:
#     cd /var/log/nginx
#     cat access.log
#
# Or continuously watch new requests with:
#     tail -f access.log
#
# This allows us to see the same NGINX access.log from inside the container
# while also keeping a copy on the host.

#we added the volume in docker compose and then we can enter the nginx container
#and check logs in cd /var/log/nginx cat access.log



    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    error_log /var/log/nginx/error.log warn;


    # =========================================================
    # UPSTREAM SERVICES
    # =========================================================

    upstream fastapi {

        server fastapi:8000;

        keepalive 32;
    }


    upstream express {

        server express:3000;

        keepalive 32;
    }


    upstream springboot {

        server springboot:8080;

        keepalive 32;
    }


    upstream dotnet {

        server dotnet:5000;

        keepalive 32;
    }


    # =========================================================
    # API GATEWAY
    # =========================================================

    server {

        listen 80;

        server_name _;


        # =====================================================
        # BASIC SECURITY
        # =====================================================

        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "SAMEORIGIN" always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;


        # =====================================================
        # COMMON PROXY SETTINGS
        # =====================================================

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        # =====================================================
        # TIMEOUTS
        # =====================================================

        proxy_connect_timeout 5s;

        proxy_send_timeout 60s;

        proxy_read_timeout 60s;


        # =====================================================
        # BUFFERING
        # =====================================================

        proxy_buffering on;

        proxy_buffers 16 16k;

        proxy_buffer_size 16k;


        # =====================================================
        # FASTAPI
        # =====================================================
#When a client sends a request whose path starts with /api/v1/implementations/fastapi/, 
#use the rules inside this block.
#For example
#/api/v1/implementations/fastapi/
#/api/v1/implementations/fastapi/health
#/api/v1/implementations/fastapi/employees
#proxy pass tells nginx Forward the matched request to the upstream named fastapi
#Because the proxypass has trailing /
#NGINX replaces the matching location prefix
#For example http://localhost/api/v1/implementations/fastapi/health
#nginx sees /api/v1/implementations/fastapi/ and replaces that part with /
#So the backend receives:
#http://fastapi:8000/health

# "fastapi" here refers to the NGINX upstream named "fastapi".
# The upstream points to the FastAPI container on port 8000.
# Therefore, http://fastapi/ does NOT mean localhost:8000.
# It means: send the request to the server defined in the "fastapi" upstream.
#proxy_pass http://fastapi/;

        location /api/v1/implementations/fastapi/ {

            proxy_pass http://fastapi/;

        }



        # =====================================================
        # EXPRESS
        # =====================================================

        location /api/v1/implementations/express/ {

            proxy_pass http://express/;

        }


        # =====================================================
        # SPRING BOOT
        # =====================================================

        location /api/v1/implementations/springboot/ {

            proxy_pass http://springboot/;

        }


        # =====================================================
        # DOTNET
        # =====================================================

        location /api/v1/implementations/dotnet/ {

            proxy_pass http://dotnet/;

        }


        # =====================================================
        # ROOT
        # =====================================================

        location = / {

            default_type text/plain;

            return 200 "API Gateway Running\n";

        }


        # =====================================================
        # BLOCK HIDDEN FILES
        # =====================================================

        location ~ /\. {

            deny all;

        }

    }

}



#curl http://localhost/api/v1/implementations/fastapi/health

#curl http://localhost/api/v1/implementations/express/health

#curl http://localhost/api/v1/implementations/springboot/health

#curl http://localhost/api/v1/implementations/dotnet/health




# I'll explain what happens from the moment you run curl on your laptop until Express sends a response back.

# 1. Your request

# You run this command on your laptop:

# curl http://employee-alb-154602296.ap-southeast-2.elb.amazonaws.com/api/v1/implementations/express/health

# You're asking your application:

# "Please check whether my Express backend is healthy."

# Your request contains two important parts:

# Hostname:

# employee-alb-154602296.ap-southeast-2.elb.amazonaws.com

# This identifies your AWS Application Load Balancer.

# Path:

# /api/v1/implementations/express/health

# This tells NGINX which backend should handle the request.

# Now let's follow the request.

# 2. Step-by-step request flow
# Step 1: Your laptop sends the request

# Your laptop needs to find the IP address associated with the ALB DNS name.

# DNS resolves the hostname to addresses for the load balancer.

# Your laptop then establishes an HTTP connection to the ALB on port 80.

# Your laptop
#      |
#      | HTTP request
#      | Destination port: 80
#      v
# AWS Application Load Balancer

# At this point, your laptop doesn't need to know your EC2 instance's IP address.

# It only needs the ALB's DNS name.

# Step 2: The ALB receives the request

# Your ALB is configured with an HTTP listener on port 80.

# The listener accepts the incoming HTTP request.

# Your configuration is effectively:

# ALB: employee-alb

# Listener:
#   Protocol: HTTP
#   Port: 80

# Default action:
#   Forward to employee-app-tg

# The ALB checks its listener rules to determine which action to perform.

# In your current configuration, the default action forwards the request to the target group employee-app-tg.

# Step 3: The ALB selects a target

# Your target group contains your EC2 instance:

# Target group: employee-app-tg

# Registered target:
#   employee-app-server
#   Port: 80

# The ALB selects an eligible, healthy target according to its routing behavior.

# Because you currently have one EC2 instance registered, that instance receives the request when it is healthy and eligible.

# The ALB forwards the HTTP request to the EC2 instance on port 80.

#                  AWS ALB
#                     |
#                     | HTTP :80
#                     v
#            employee-app-server
#                     |
#                     v
#                  NGINX :80

# Important: The ALB does not automatically send requests to all four backend containers. It sends requests to registered targets, which in your current design are EC2 instances.

# Step 4: EC2 receives the request

# Your EC2 instance runs Docker and Docker Compose.

# Your Compose configuration publishes NGINX's container port to the EC2 host's port 80:

# nginx:
#   ports:
#     - "80:80"

# This mapping means:

# EC2 host port 80
#        |
#        v
# NGINX container port 80

# Docker directs the incoming connection to the NGINX container.

# NGINX now receives the original request path:

# /api/v1/implementations/express/health
# Step 5: NGINX identifies the Express backend

# Your nginx.conf contains:

# upstream express {
#     server express:3000;
#     keepalive 32;
# }

# This defines an upstream group named express, pointing to the Express container on port 3000.

# You also have this location block:

# location /api/v1/implementations/express/ {
#     proxy_pass http://express/;
# }

# NGINX matches the request path against this location.

# Because the proxy_pass URL ends in /, NGINX replaces the matching location prefix with /.

# The original path is:

# /api/v1/implementations/express/health

# The matching prefix is:

# /api/v1/implementations/express/

# The path forwarded to Express becomes:

# /health

# NGINX forwards the request to:

# http://express:3000/health

# Here, express is the Docker service name resolved through your Docker network, and 3000 is the Express application's listening port.

# Step 6: Express processes the request

# Your Express container receives:

# GET /health

# Your application processes the request and returns a response.

# For example, if your health endpoint is implemented to return this response:

# {
#   "status": "UP"
# }

# Express sends that response back to NGINX.

# Step 7: The response travels back

# The response returns through the reverse path:

# Express container :3000
#           |
#           v
# NGINX container :80
#           |
#           v
# EC2 application server
#           |
#           v
# AWS ALB
#           |
#           v
# Your laptop

# Your terminal displays the response.

# The complete request flow looks like this:

#                  YOUR LAPTOP
#                       |
#                       | HTTP :80
#                       v
#           +-------------------------+
#           | AWS APPLICATION         |
#           | LOAD BALANCER           |
#           | employee-alb            |
#           +-------------------------+
#                       |
#                       | Listener forwards request
#                       v
#           +-------------------------+
#           | TARGET GROUP            |
#           | employee-app-tg         |
#           |                         |
#           | EC2 target :80          |
#           +-------------------------+
#                       |
#                       v
#           +-------------------------+
#           | EC2 APPLICATION SERVER  |
#           |                         |
#           | Docker port mapping     |
#           | Host :80 → Container :80|
#           +-------------------------+
#                       |
#                       v
#           +-------------------------+
#           | NGINX API GATEWAY       |
#           |                         |
#           | Matches Express path    |
#           +-------------------------+
#                       |
#                       | Docker network
#                       | HTTP :3000
#                       v
#           +-------------------------+
#           | EXPRESS CONTAINER       |
#           |                         |
#           | GET /health             |
#           +-------------------------+
#                       |
#                       v
#                 HTTP RESPONSE
#                       |
#                       v
#                   YOUR LAPTOP